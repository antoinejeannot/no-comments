version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # 0.26.0 segfaults when nodes are kept: tree-sitter/py-tree-sitter#472
      - dependency-name: tree-sitter
        versions: ["0.26.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
