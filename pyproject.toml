[project]
name = "no-comments"
version = "0.1.0"
description = "pre-commit hook that rejects new comments unless they end with `keep: <CODE>`."
readme = "README.md"
authors = [
    { name = "Antoine Jeannot", email = "antoine.jeannot1002+github@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # 0.26.0 segfaults when nodes are kept: tree-sitter/py-tree-sitter#472
    "tree-sitter>=0.25.2,!=0.26.0",
    "tree-sitter-language-pack>=1.21.0",
]

[project.scripts]
no-comments = "no_comments:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
python_files = ["tests.py"]
