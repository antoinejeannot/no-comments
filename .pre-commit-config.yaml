repos:
  - repo: local
    hooks:
      - id: no-comments
        name: no-comments
        entry: uv run --locked no-comments
        language: system
        types: [text]
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format .
        language: system
        pass_filenames: false
        always_run: true
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
